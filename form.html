<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="2.png">
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
    </head>

    <body>
        <section class="event-form-section">
            <div class="event-form-container">
                <div class="event-form-header">
                    <h1>Create an Event</h1>
                    <p>Use the form below to add event details, contact info, pricing, schedule, location, and media.</p>
                </div>

                <div class="form-progress">
                    <button class="progress-step active" type="button" data-step="0">
                        <span>1</span>
                        <strong>Event Information</strong>
                    </button>
                    <button class="progress-step" type="button" data-step="1">
                        <span>2</span>
                        <strong>Contact Information</strong>
                    </button>
                    <button class="progress-step" type="button" data-step="2">
                        <span>3</span>
                        <strong>Prices & Offers</strong>
                    </button>
                    <button class="progress-step" type="button" data-step="3">
                        <span>4</span>
                        <strong>Date & Time</strong>
                    </button>
                    <button class="progress-step" type="button" data-step="4">
                        <span>5</span>
                        <strong>Location</strong>
                    </button>
                    <button class="progress-step" type="button" data-step="5">
                        <span>6</span>
                        <strong>Gallery & Social Media</strong>
                    </button>
                </div>

                <form class="event-form" novalidate>
                    <div class="form-step active" data-step="0">
                        <h2>Event Information</h2>
                        <label>
                            Event Title *
                            <input type="text" placeholder="Enter event title">
                            <small>Enter the title.</small>
                        </label>
                        <label>
                            Event Category *
                            <select>
                                <option>Select Category</option>
                                <option>Conference</option>
                                <option>Workshop</option>
                            </select>
                            <small>Choose the category of your event. You can choose multiple categories for your event.</small>
                        </label>
                        <label>
                            Default Category *
                            <select>
                                <option>Select default category</option>
                                <option>Business</option>
                                <option>Entertainment</option>
                            </select>
                            <small>The default category can affect the listing URL and map marker.</small>
                        </label>
                    </div>

                    <div class="form-step" data-step="1">
                        <h2>Contact Information</h2>
                        <label>
                            Organizer Name *
                            <input type="text" placeholder="Enter organizer name">
                        </label>
                        <label>
                            Email Address *
                            <input type="email" placeholder="Enter email address">
                        </label>
                        <label>
                            Phone Number
                            <input type="tel" placeholder="Enter phone number">
                        </label>
                    </div>

                    <div class="form-step" data-step="2">
                        <h2>Prices & Offers</h2>
                        <label>
                            Ticket Price
                            <input type="text" placeholder="Enter ticket price">
                        </label>
                        <label>
                            Offer Code
                            <input type="text" placeholder="Enter promo code">
                        </label>
                        <label>
                            Discount Details
                            <input type="text" placeholder="Add discount description">
                        </label>
                    </div>

                    <div class="form-step" data-step="3">
                        <h2>Date & Time</h2>
                        <label>
                            Event Date
                            <input type="date">
                        </label>
                        <label>
                            Start Time
                            <input type="time">
                        </label>
                        <label>
                            End Time
                            <input type="time">
                        </label>
                    </div>

                    <div class="form-step" data-step="4">
                        <h2>Location</h2>
                        <label>
                            Venue Name
                            <input type="text" placeholder="Enter venue name">
                        </label>
                        <label>
                            Address
                            <input type="text" placeholder="Enter full address">
                        </label>
                        <label>
                            City / State
                            <input type="text" placeholder="Enter city or state">
                        </label>
                    </div>

                    <div class="form-step" data-step="5">
                        <h2>Gallery & Social Media</h2>
                        <label>
                            Photo Link
                            <input type="text" placeholder="Enter image URL">
                        </label>
                        <label>
                            Instagram URL
                            <input type="url" placeholder="Enter Instagram link">
                        </label>
                        <label>
                            Facebook Event URL
                            <input type="url" placeholder="Enter Facebook event link">
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="step-btn prev" disabled>Back</button>
                        <button type="button" class="step-btn next">Next</button>
                    </div>
                    <div class="error-message" style="display: none; color: red; margin-top: 10px; font-weight: bold;"></div>
                </form>
            </div>
        </section>

        <script>
            const formSteps = Array.from(document.querySelectorAll('.form-step'));
            const progressSteps = Array.from(document.querySelectorAll('.progress-step'));
            const prevStepBtn = document.querySelector('.step-btn.prev');
            const nextStepBtn = document.querySelector('.step-btn.next');
            const eventForm = document.querySelector('.event-form');
            const errorMessage = document.querySelector('.error-message');
            let activeFormStep = 0;

            const validateCurrentStep = () => {
                const currentStep = formSteps[activeFormStep];
                const inputs = currentStep.querySelectorAll('input, select');
                let isValid = true;
                let emptyFields = [];
                let errorText = '';

                inputs.forEach((input) => {
                    const label = input.closest('label');
                    const labelText = label ? label.textContent.trim() : '';
                    
                    // Check if field is required (marked with *)
                    if (labelText.includes('*')) {
                        const value = input.value.trim();
                        if (value === '' || value === 'Select Category' || value === 'Select default category' || value === 'Select a date') {
                            isValid = false;
                            const fieldName = labelText.split('*')[0].trim();
                            emptyFields.push(fieldName);
                        }
                    }
                });

                // Check if event date is in the past (step 3 - Date & Time)
                if (activeFormStep === 3) {
                    const dateInput = currentStep.querySelector('input[type="date"]');
                    if (dateInput && dateInput.value) {
                        const selectedDate = new Date(dateInput.value);
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);
                        
                        if (selectedDate < today) {
                            isValid = false;
                            errorText = '⚠️ Event date cannot be in the past. Please select a future date.';
                        }
                    }
                }

                if (!isValid) {
                    if (errorText) {
                        errorMessage.textContent = errorText;
                    } else {
                        errorMessage.textContent = '⚠️ Please fill these fields: ' + emptyFields.join(', ');
                    }
                    errorMessage.style.display = 'block';
                } else {
                    errorMessage.style.display = 'none';
                }

                return isValid;
            };

            const updateFormStep = () => {
                formSteps.forEach((step, idx) => step.classList.toggle('active', idx === activeFormStep));
                progressSteps.forEach((step, idx) => step.classList.toggle('active', idx === activeFormStep));
                prevStepBtn.disabled = activeFormStep === 0;
                nextStepBtn.textContent = activeFormStep === formSteps.length - 1 ? 'Submit' : 'Next';
                errorMessage.style.display = 'none';
            };

            progressSteps.forEach((step) => {
                step.addEventListener('click', () => {
                    const stepIndex = Number(step.dataset.step);
                    activeFormStep = stepIndex;
                    updateFormStep();
                });
            });

            prevStepBtn?.addEventListener('click', () => {
                if (activeFormStep > 0) {
                    activeFormStep -= 1;
                    updateFormStep();
                }
            });

            nextStepBtn?.addEventListener('click', () => {
                if (validateCurrentStep()) {
                    if (activeFormStep < formSteps.length - 1) {
                        activeFormStep += 1;
                        updateFormStep();
                    } else {
                        eventForm?.requestSubmit();
                    }
                }
            });

            eventForm?.addEventListener('submit', (event) => {
                event.preventDefault();
                alert('Event submitted successfully!');
            });
        </script>
    </body>
</html>
